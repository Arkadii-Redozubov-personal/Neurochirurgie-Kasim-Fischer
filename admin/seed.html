            "title": "Bizim <span style=\"color: var(--primary);\">takım</span>",
            "desc": "Modern bir çalışma ortamında, sağlığınızı önemsemek gibi ortak bir amaç etrafında birleşen motive çalışanlar."
          },
          "ar": {
            "title": "ملكنا <span style=\"color: var(--primary);\">فريق</span>",
            "desc": "موظفون متحمسون في بيئة عمل حديثة، متحدون بهدف مشترك - العناية بصحتك."
          }
        }
      }
    ]
  }
];

    function log(msg, color = '#94a3b8') {
      statusEl.innerHTML += `<div style="color:${color}; margin-bottom:4px;">${msg}</div>`;
      statusEl.scrollTop = statusEl.scrollHeight;
    }

    function setProgress(pct) {
      document.getElementById('progressFill').style.width = pct + '%';
    }

        window.startSeed = async () => {
      statusEl = document.getElementById('status');
      statusEl.innerHTML = '';
      document.getElementById('seedBtn').disabled = true;
      document.getElementById('seedBtn').textContent = '⏳ Lädt...';

      log('🚀 Starte Seed-Prozess...', '#00c9a7');
      log('');

      try {
        // Step 1: Clear & seed schwerpunkte
        log('🗑️  Lösche vorhandene Schwerpunkte...', '#f59e0b');
        let snap = await getDocs(collection(db, 'schwerpunkte'));
        for (const d of snap.docs) await deleteDoc(doc(db, 'schwerpunkte', d.id));
        log(`   ${snap.size} Schwerpunkte gelöscht.`);
        setProgress(10);

        log('📥 Lade Schwerpunkte...', '#00c9a7');
        for (let i = 0; i < SCHWERPUNKTE.length; i++) {
          await addDoc(collection(db, 'schwerpunkte'), SCHWERPUNKTE[i]);
          log(`   ✅ ${i + 1}/${SCHWERPUNKTE.length}: ${SCHWERPUNKTE[i].de.title}`, '#86efac');
          setProgress(10 + Math.round((i + 1) / SCHWERPUNKTE.length * 15));
        }

        // Step 2: Clear & seed treatments
        log('');
        log('🗑️  Lösche vorhandene Behandlungen...', '#f59e0b');
        snap = await getDocs(collection(db, 'treatments'));
        for (const d of snap.docs) await deleteDoc(doc(db, 'treatments', d.id));
        log(`   ${snap.size} Behandlungen gelöscht.`);
        setProgress(30);

        log('📥 Lade Behandlungen...', '#00c9a7');
        for (let i = 0; i < TREATMENTS.length; i++) {
          await addDoc(collection(db, 'treatments'), TREATMENTS[i]);
          log(`   ✅ ${i + 1}/${TREATMENTS.length}: ${TREATMENTS[i].de.title}`, '#86efac');
          setProgress(30 + Math.round((i + 1) / TREATMENTS.length * 20));
        }

        // Step 3: Clear & seed team
        log('');
        log('🗑️  Lösche vorhandene Team-Mitglieder...', '#f59e0b');
        snap = await getDocs(collection(db, 'team'));
        for (const d of snap.docs) await deleteDoc(doc(db, 'team', d.id));
        log(`   ${snap.size} Team-Mitglieder gelöscht.`);
        setProgress(55);

        log('📥 Lade Team-Mitglieder...', '#00c9a7');
        for (let i = 0; i < TEAM.length; i++) {
          await addDoc(collection(db, 'team'), TEAM[i]);
          log(`   ✅ ${i + 1}/${TEAM.length}: ${TEAM[i].de.name}`, '#86efac');
          setProgress(55 + Math.round((i + 1) / TEAM.length * 15));
        }

        // Step 4: Clear & seed press
        log('');
        log('🗑️  Lösche vorhandene Presseartikel...', '#f59e0b');
        snap = await getDocs(collection(db, 'press'));
        for (const d of snap.docs) await deleteDoc(doc(db, 'press', d.id));
        log(`   ${snap.size} Artikel gelöscht.`);
        setProgress(75);

        log('📰 Lade Presseartikel...', '#00c9a7');
        for (let i = 0; i < PRESS.length; i++) {
          await addDoc(collection(db, 'press'), PRESS[i]);
          log(`   ✅ ${i + 1}/${PRESS.length}: ${PRESS[i].title}`, '#86efac');
          setProgress(75 + Math.round((i + 1) / PRESS.length * 15));
        }

        // Step 5: Clear & seed pages
        log('');
        log('🗑️  Lösche vorhandene Seiteninhalte...', '#f59e0b');
        snap = await getDocs(collection(db, 'pages'));
        for (const d of snap.docs) await deleteDoc(doc(db, 'pages', d.id));
        log(`   ${snap.size} Seiten gelöscht.`);
        setProgress(95);
        
        log('📄 Lade Seiteninhalte...', '#00c9a7');
        for (let i = 0; i < PAGES.length; i++) {
          await addDoc(collection(db, 'pages'), PAGES[i]);
          log(`   ✅ ${i + 1}/${PAGES.length}: ${PAGES[i].name}`, '#86efac');
        }
        setProgress(100);

        log('');
        log('🎉 Fertig! Alle Daten wurden erfolgreich geladen.', '#00c9a7');
        log(`   🔹 ${SCHWERPUNKTE.length} Schwerpunkte`, '#86efac');
        log(`   🔹 ${TREATMENTS.length} Behandlungen`, '#86efac');
        log(`   🔹 ${TEAM.length} Team-Mitglieder`, '#86efac');
        log(`   🔹 ${PRESS.length} Presseartikel`, '#86efac');
        log(`   🔹 ${PAGES.length} Seiten`, '#86efac');
        log('');
        log('➡️ <a href="dashboard.html" style="color:#0072ff;">Zum Dashboard gehen</a>', '#94a3b8');

      } catch (err) {
        console.error(err);
        log('');
        log('❌ Fehler: ' + err.message, '#ef4444');
      } finally {
        document.getElementById('seedBtn').disabled = false;
        document.getElementById('seedBtn').textContent = '🚀 Starten – Daten in Firebase laden';
      }
    };

  </script>
</body>
